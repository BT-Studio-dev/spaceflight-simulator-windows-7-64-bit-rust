name: Check

# Fast feedback loop: build, lint, test and a headless render of every screen.
# The renderer is pure software, so Linux and Windows produce identical frames.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: 1.77.1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup default $RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-check2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}

      - name: Build
        run: |
          set -o pipefail
          cargo build --all-targets 2>&1 | tee build.log | tail -60

      - name: Test
        if: always()
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout 200 cargo test --all-targets -- --test-threads=4 2>&1 | tee test.log | tail -40

      - name: Render screens
        if: always()
        timeout-minutes: 3
        run: |
          set -o pipefail
          cargo run --bin screenshots -- --out screenshots --size 1280x760 2>&1 | tee render.log | tail -40

      - name: Self test
        if: always()
        run: |
          set -o pipefail
          cargo run --bin spaceflight -- --self-test 2>&1 | tee selftest.log | tail -40

      - name: Clippy
        if: always()
        run: |
          cargo clippy --all-targets 2>&1 | tee clippy.log | tail -5

      - name: Format
        if: always()
        run: |
          cargo fmt --all -- --check > fmt.log 2>&1 || true
          git diff --stat > fmtstat.log 2>&1 || true
          head -c 20000 fmt.log

      # The sandbox that authored this workflow cannot read raw job logs, so the
      # interesting output is republished as check-run annotations (line by line,
      # deduplicated, capped) where it is retrievable through the API.
      - name: Publish diagnostics as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          ANSI = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          def load(name):
              if not os.path.exists(name):
                  return []
              return [ANSI.sub("", l).rstrip() for l in open(name, errors="replace")]
          blocks = []
          # Compiler errors: keep the error line plus a compact context tail.
          for log in ("build.log", "test.log", "clippy.log"):
              lines = load(log)
              for i, l in enumerate(lines):
                  if re.match(r"^(error|warning)(\[|:)", l):
                      ctx = []
                      for j in range(i + 1, min(i + 40, len(lines))):
                          nl = lines[j].strip()
                          if not nl:
                              continue
                          if nl.startswith("-->") or nl.startswith("|") or nl.startswith("=") or re.match(r"^\d+ \|", nl) or nl.startswith("help:") or nl.startswith("note:"):
                              if nl.startswith("-->") or re.match(r"^\d+ \|", nl) or nl.startswith("= note") or nl.startswith("= help"):
                                  ctx.append(nl[:200])
                          if len(ctx) >= 6:
                              break
                      if ctx:
                          blocks.append(f"{log} :: {l[:220]} || " + " ; ".join(ctx))
                      else:
                          blocks.append(f"{log} :: {l[:300]}")
          # Test failures and summary lines come from the test harness output.
          for l in load("test.log"):
              if re.search(r"(FAILED|panicked|assertion|test result|left:|right:)", l):
                  blocks.append("test :: " + l.strip()[:300])
          for l in load("selftest.log") + load("render.log"):
              if re.search(r"(FAIL|PASS|panicked|error|wrote|rendered)", l):
                  blocks.append("run :: " + l.strip()[:300])
          for l in load("fmt.log"):
              if l.startswith("Diff in"):
                  blocks.append("fmt :: " + l.strip()[:300])
          # Always include the raw tails so progress is visible even when the
          # harness is killed mid-run.
          for log in ("test.log", "render.log", "selftest.log"):
              lines = [l for l in load(log) if l.strip()]
              for l in lines[-25:]:
                  blocks.append(f"tail[{log}] :: " + l.strip()[:260])
          seen, uniq = set(), []
          for b in blocks:
              if b in seen:
                  continue
              seen.add(b)
              uniq.append(b)
          for b in uniq[:45]:
              msg = b.replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::warning title=diag::{msg}")
          print(f"::notice::{len(uniq)} diagnostic blocks")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            *.log
            screenshots/
          if-no-files-found: warn
