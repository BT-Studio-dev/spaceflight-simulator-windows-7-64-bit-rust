name: Check

# Fast feedback loop: build, lint, test and a headless render of every screen.
# The renderer is pure software, so Linux and Windows produce identical frames.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.77.1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup default $RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-check2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}

      - name: Build
        run: |
          set -o pipefail
          cargo build --all-targets 2>&1 | tee build.log | tail -60

      - name: Test
        if: always()
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee test.log | tail -40

      - name: Render screens
        if: always()
        run: |
          set -o pipefail
          cargo run --bin screenshots -- --out screenshots --size 1280x760 2>&1 | tee render.log | tail -40

      - name: Self test
        if: always()
        run: |
          set -o pipefail
          cargo run --bin spaceflight -- --self-test 2>&1 | tee selftest.log | tail -40

      - name: Clippy
        if: always()
        run: |
          cargo clippy --all-targets 2>&1 | tee clippy.log | tail -5

      - name: Format
        if: always()
        run: |
          cargo fmt --all -- --check > fmt.log 2>&1 || true
          git diff --stat > fmtstat.log 2>&1 || true
          head -c 20000 fmt.log

      # The sandbox that authored this workflow cannot read raw job logs, so the
      # interesting output is republished as check-run annotations (line by line,
      # deduplicated, capped) where it is retrievable through the API.
      - name: Publish diagnostics as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re
          seen = set()
          out = []
          for name in ["build.log", "test.log", "render.log", "selftest.log", "clippy.log", "fmt.log"]:
              if not os.path.exists(name):
                  continue
              lines = open(name, errors="replace").read().splitlines()
              interesting = [l for l in lines if re.search(r"(^error|^warning|\bFAILED\b|panicked|test result|assert|-->|\bPASS\b|\bFAIL\b|rendered|wrote|checks)", l)]
              for l in interesting[-60:]:
                  key = (name, l[:150])
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(f"{name}: {l[:400]}")
          for i in range(0, min(len(out), 180)):
              msg = out[i].replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::warning title=diag::{msg}")
          print(f"::notice::annotation lines: {len(out)}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            *.log
            screenshots/
          if-no-files-found: warn
