name: Check

# Fast feedback loop: build, lint, test and a headless render of every screen.
# The renderer is pure software, so Linux and Windows produce identical frames.
permissions:
  contents: read
  checks: write

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: 1.77.1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup default $RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-check2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}

      - name: Build
        run: |
          set -o pipefail
          cargo build --all-targets 2>&1 | tee build.log | tail -60

      - name: Test
        if: always()
        timeout-minutes: 6
        run: |
          # Each unit test is capped so a hang is reported as a hang, not a
          # 25-minute timeout: cargo test has no per-test timeout, so the
          # binary is run under `timeout` as a whole and its output kept.
          SPACEFLIGHT_TRACE=1 timeout 240 cargo test --all-targets -- --test-threads=1 2>&1 | tee test.log | tail -60
          code=${PIPESTATUS[0]}
          echo "cargo test exit: $code"
          exit $code

      - name: Render screens
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          cargo build --bin screenshots
          SPACEFLIGHT_TRACE=1 timeout 120 cargo run --bin screenshots -- --out screenshots --size 1280x760 2>&1 | tee render.log | tail -40

      - name: Self test
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          cargo build --bin spaceflight
          SPACEFLIGHT_TRACE=1 timeout 120 cargo run --bin spaceflight -- --self-test 2>&1 | tee selftest.log | tail -40

      - name: Clippy
        if: always()
        run: |
          cargo clippy --all-targets 2>&1 | tee clippy.log | tail -5

      - name: Format
        if: always()
        run: |
          cargo fmt --all -- --check > fmt.log 2>&1 || true
          git diff --stat > fmtstat.log 2>&1 || true
          head -c 20000 fmt.log

      # The sandbox that authored this workflow cannot read raw job logs, so the
      # interesting output is republished as check-run annotations (line by line,
      # deduplicated, capped) where it is retrievable through the API.
      - name: Publish diagnostics (check-run text)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/payload.json
          import json, re, os
          ANSI = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          def load(name):
              if not os.path.exists(name):
                  return []
              return [ANSI.sub("", l).rstrip() for l in open(name, errors="replace")]
          out = []
          for log in ("build.log", "test.log", "render.log", "selftest.log", "clippy.log", "fmt.log"):
              lines = load(log)
              out.append(f"[{log}: {len(lines)} lines, {sum(len(l) for l in lines)} bytes]")
              if not lines:
                  continue
              out.append("=" * 20 + " " + log + " ==" * 5)
              # errors first, then the tail
              errs = [l for l in lines if re.match(r"^(error|warning\[)", l) or "panicked" in l or "FAILED" in l or l.startswith("---- ") or "assertion" in l or "left:" in l or "right:" in l or re.search(r"panicked at", l) or re.search(r"^\w[\w:]+\s", l) and "FAILED" in l]
              out.extend(errs[:120])
              out.append("--- tail ---")
              out.extend(lines[-70:])
          text = "\n".join(out)[:100000]
          print(json.dumps({"output": {"title": "diagnostics", "summary": "build/test/render logs", "text": text}}))
          PY
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          ID=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs[] | select(.name=="linux") | .id' 2>/dev/null | head -1)
          echo "commit $SHA"; set +e
          echo "check run id: $ID"
          gh api --method PATCH "repos/$REPO/check-runs/$ID" --input /tmp/payload.json --jq '.output.title' || echo "PATCH failed for id [$ID]"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            *.log
            screenshots/
          if-no-files-found: warn
